plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.khorunaliyev'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// Java 18 is end-of-life and receives no security updates. Java 21 is the
		// current LTS and is fully supported by Spring Boot 3.4.x. This is a safe,
		// source-compatible bump (Java 18 sources compile unchanged on 21).
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.postgresql:postgresql'

	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9")
	implementation("org.apache.poi:poi-ooxml:5.4.1")

	implementation 'org.springframework.boot:spring-boot-starter-validation'



	implementation("software.amazon.awssdk:s3:2.25.25")


	implementation("io.jsonwebtoken:jjwt-api:0.12.6")
	runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.12.6")
	runtimeOnly("io.jsonwebtoken:jjwt-impl:0.12.6")


	implementation("org.hibernate:hibernate-spatial:7.2.6.Final")
	implementation 'org.wololo:jts2geojson:0.18.1'

	implementation("net.coobird:thumbnailator:0.4.21")

	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

}

// The default `test` task runs fast, self-contained unit tests only. Tests that
// require external infrastructure (a live Postgres/PostGIS database) are tagged
// "integration" and excluded here so CI and local runs stay green without Docker.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

// Opt-in task for the database-backed integration/smoke tests.
// Run with: ./gradlew integrationTest  (requires a configured database)
tasks.register('integrationTest', Test) {
	description = 'Runs tests tagged "integration" (requires external infrastructure).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
}
