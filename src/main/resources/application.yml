spring:

  application:
    name: kettu

  mvc:
    throw-exception-if-no-handler-found: true # Handler topilmasa xato otish
  web:
    resources:
      add-mappings: false # Static resurslarni qidirishni to'xtatish (API uchun shart)

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  security:
    oauth2:
      client:
        registration:
          google:
            # The client-id is public by OAuth2 design; the client-secret is sensitive
            # and MUST be provided via the GOOGLE_CLIENT_SECRET environment variable.
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/kettu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

# JSON Web Token settings. The secret MUST be overridden in production via JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:M1grationT0JWTwithGoogleOAuth2isSecure2025lllllll}
  expiration-ms: ${JWT_EXPIRATION_MS:144000000}

cloudflare:
  r2:
    # All R2 credentials are sensitive and MUST be supplied via environment variables.
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    region: ${R2_REGION:auto}
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:khorunaliyev-kettu}

logging:
  level:
    org.hibernate:
      SQL: ${HIBERNATE_SQL_LOG_LEVEL:INFO}
      type:
        descriptor:
          sql:
            BasicBinder: ${HIBERNATE_BIND_LOG_LEVEL:INFO}
