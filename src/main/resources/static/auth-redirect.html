<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login Successful</title>
    <style>
        body {
          font-family: sans-serif;
          text-align: center;
          margin-top: 100px;
        }
        button {
          padding: 12px 24px;
          font-size: 16px;
          background-color: #007BFF;
          color: white;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          margin-top: 30px;
        }
        button:hover {
          background-color: #0056b3;
        }
    </style>
</head>
<body>
<h1>✅ You have successfully logged in!</h1>
<p>Click the button below to continue to the app.</p>

<button onclick="openApp()">Continue</button>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");
    const platform = urlParams.get("platform") || "mobile";

    function handleRedirect() {
        if (!token) {
            document.body.innerHTML = "<h1>❌ Token topilmadi!</h1>";
            return;
        }

        if (platform === "web") {
            // Web sayt (Production)
            window.location.href = `https://thekettu.com/auth/callback?token=${token}`;
        } else if (platform === "admin") {
            // Admin Panel (Localhost Vite server)
            window.location.href = `http://localhost:5173/auth/callback?token=${token}`;
        } else {
            // Mobil ilova (Deep Link)
            window.location.href = `thekettu://auth?token=${token}`;
        }
    }

    function openApp() {
        handleRedirect();
    }

    window.addEventListener('DOMContentLoaded', (event) => {
        handleRedirect();
    });
</script>
</body>
</html>
